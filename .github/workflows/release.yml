# Tag vX.Y.Z on main -> build both arches with the pinned CLI embedded and
# the version stamped, publish arch-suffixed assets. A GitHub release ships
# nothing to users on its own — rollout happens in /admin/releases, and the
# server's asset matcher requires the arch token in the file name (which is
# why no unsuffixed copy is uploaded).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on main" }

      # -Version is load-bearing: an unstamped binary reports "dev" and
      # permanently refuses self-updates, so a release without it would strand
      # every user who installs it. -SkipCliBundle because the pinned payload
      # is fetched here, not built from ../tokitoki-cli (absent on the runner).
      - name: Build amd64
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-cli-release.ps1 -Arch amd64
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Task build -Arch amd64 -Version $version -SkipCliBundle
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\tokitoki-windows.exe dist\tokitoki-windows-amd64.exe

      # A fresh CLI payload per arch: the embedded binary must match the app's
      # target architecture. clean drops the amd64 payload and build output.
      - name: Build arm64
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Task clean
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-cli-release.ps1 -Arch arm64
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Task build -Arch arm64 -Version $version -SkipCliBundle
          Copy-Item build\tokitoki-windows.exe dist\tokitoki-windows-arm64.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist\tokitoki-windows-amd64.exe `
            dist\tokitoki-windows-arm64.exe `
            --title "tokitoki-windows $env:GITHUB_REF_NAME" `
            --notes "Windows tray app $env:GITHUB_REF_NAME (C). Rollout is controlled in /admin/releases."
