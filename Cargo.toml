[package]
name = "tokitoki-windows"
version = "1.0.0"
edition = "2021"
rust-version = "1.87"
description = "Tokitoki system-tray agent for Windows"
license = "MIT"
build = "build.rs"

[dependencies]
flate2 = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", features = ["json"] }
url = "2"
wait-timeout = "0.2"
winreg = "0.55"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

# Mirrors the Go release ldflags "-s -w".
[profile.release]
strip = true
lto = "thin"

# Size-measurement profile (not shipped): every size knob turned to max.
[profile.release-min]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"
rust-2018-idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The Go original never puts argv/keys in errors; unwrap/expect would bypass that
# discipline, so they are banned outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
