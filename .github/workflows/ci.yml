# Windows runners bill double, so CI runs only on main pushes and PRs to main
# (mirrors the Go project's policy).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Bundle the pinned CLI release BEFORE the release build so it embeds the
      # payload. The pin (tag + sha256) lives in scripts/cli-release-pins.ps1;
      # the download is rejected on digest mismatch.
      - name: Bundle pinned CLI
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-cli-release.ps1 -Arch amd64

      # Unit tests (util + domain) build with /W4 /WX, so a warning fails CI.
      - name: Test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Task test

      # Release build with the embedded CLI, mirroring what Release ships.
      # -SkipCliBundle: the pinned payload is already in embedded/ from the
      # step above; there is no ../tokitoki-cli source on the runner.
      - name: Build (release)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Task build -Version ci -SkipCliBundle
