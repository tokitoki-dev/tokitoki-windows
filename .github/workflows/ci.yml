name: CI

# Only main and the pull requests targeting it. Work branches push often and
# a Windows runner bills at double rate, so they are checked when they are
# proposed for merge, not on every commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # The build fetches the pinned shared-CLI release asset itself
      # (scripts/fetch-cli-release.ps1), so this repo builds on its own.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: pwsh -NoProfile -File scripts/build.ps1 -Task test

      # Both release architectures are compiled here, not just the host one:
      # arm64 ships to users, so a break in it must fail CI, not the release.
      - name: Build both release architectures
        run: |
          foreach ($arch in @("amd64", "arm64")) {
            pwsh -NoProfile -File scripts/build.ps1 -Task build -Arch $arch
          }
