# Windows runners bill double, so CI runs only on main pushes and PRs to main
# (mirrors the Go project's policy).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Bundle the pinned CLI release BEFORE any compile step so clippy, tests,
      # and the release build all cover the embedded_cli code path. The pin
      # (tag + sha256) lives in scripts/cli-release-pins.ps1; the download is
      # rejected on digest mismatch.
      - name: Bundle pinned CLI
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-cli-release.ps1 -Arch amd64
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build (release)
        run: cargo build --release --locked
